services:
  web:
    build: .
    env_file: .env          # secrets live here on the server, never in git
    volumes: ["./data:/data", "./secrets:/secrets:ro"]
    restart: unless-stopped
  caddy:                    # free automatic HTTPS
    image: caddy:2
    ports: ["80:80", "443:443"]
    command: caddy reverse-proxy --from ${DOMAIN} --to web:8000
    volumes: ["caddy:/data"]
    restart: unless-stopped
volumes:
  caddy:
