<!doctype html>
<html lang="en" data-theme-bg="sports" data-style="miyazaki">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moment Manga</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Dela+Gothic+One&family=Luckiest+Guy&family=Shippori+Mincho+B1:wght@800&family=Zen+Kaku+Gothic+New:wght@400;700&family=Zen+Maru+Gothic:wght@700&family=ZCOOL+KuaiLe&family=ZCOOL+QingKe+HuangYou&family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;700&display=swap">
<style>
/* Layout: one centred stage. Row 1 = upload box + payment QR; row 2 = two telephone dials side by side, each under its title.
   Wide screens add a demo video column on the left; narrow screens put the demo last.
   Every colour is a style token; the right dial swaps the token set on <html>, the left dial swaps the line-art layer. */
@property --bg1    { syntax: "<color>"; inherits: true; initial-value: #bfe6f5; }
@property --bg2    { syntax: "<color>"; inherits: true; initial-value: #e9f6d6; }
@property --paper  { syntax: "<color>"; inherits: true; initial-value: #fffaf0; }
@property --ink    { syntax: "<color>"; inherits: true; initial-value: #2f4a3a; }
@property --accent { syntax: "<color>"; inherits: true; initial-value: #5fae63; }
@property --accent2{ syntax: "<color>"; inherits: true; initial-value: #f2b84b; }
@property --line   { syntax: "<color>"; inherits: true; initial-value: #6f9f82; }
@property --plate  { syntax: "<color>"; inherits: true; initial-value: #f4ecd8; }

:root {
  color-scheme: light;
  /* Hayao Miyazaki (default): sky, meadow, sun */
  --bg1: #bfe6f5; --bg2: #e9f6d6; --paper: #fffaf0; --ink: #2f4a3a;
  --accent: #5fae63; --accent2: #f2b84b; --line: #6f9f82; --plate: #f4ecd8;
  --line-w: 1.5; --line-o: .5;
  --radius: 30px; --bw: 2px; --shadow: 0 14px 34px rgb(60 110 80 / .2);
  --font-display: "Zen Maru Gothic", "ZCOOL KuaiLe", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
  --font-body: "Zen Kaku Gothic New", "Noto Sans SC", "PingFang SC", "Hiragino Sans", system-ui, sans-serif;
  --disp-track: 0;
  --t: 1.4s cubic-bezier(.4, 0, .2, 1);
}
:root[data-style="naruto"] {
  --bg1: #ffc15e; --bg2: #ff7a1a; --paper: #fff6e6; --ink: #1d2340;
  --accent: #233a8f; --accent2: #ff6a00; --line: #8a3300; --plate: #ffe2b8;
  --line-w: 2.2; --line-o: .42;
  --radius: 14px; --bw: 3px; --shadow: 6px 6px 0 #1d2340;
  --font-display: "Bangers", "ZCOOL QingKe HuangYou", "Impact", system-ui, sans-serif; --disp-track: .04em;
}
:root[data-style="slamdunk"] {
  --bg1: #ffffff; --bg2: #ececec; --paper: #ffffff; --ink: #111111;
  --accent: #d7262e; --accent2: #111111; --line: #111111; --plate: #f3f0ea;
  --line-w: 2.6; --line-o: .36;
  --radius: 4px; --bw: 3.5px; --shadow: 8px 8px 0 #111111;
  --font-display: "Dela Gothic One", "ZCOOL QingKe HuangYou", "Impact", system-ui, sans-serif; --disp-track: 0;
}
:root[data-style="demonslayer"] {
  --bg1: #24493e; --bg2: #0d1a16; --paper: #f6efe2; --ink: #1a1614;
  --accent: #b8323c; --accent2: #e8b04a; --line: #a9e0c9; --plate: #efe2c8;
  --line-w: 1.6; --line-o: .45;
  --radius: 10px; --bw: 2.5px; --shadow: 0 0 0 4px #e8b04a, 0 18px 40px rgb(0 0 0 / .45);
  --font-display: "Shippori Mincho B1", "Ma Shan Zheng", "Songti SC", serif; --disp-track: .02em;
}
:root[data-style="onepiece"] {
  --bg1: #58c8f5; --bg2: #0a6fb3; --paper: #fff1cf; --ink: #3b2412;
  --accent: #e2372f; --accent2: #ffd54f; --line: #eaf6ff; --plate: #f7deaa;
  --line-w: 1.9; --line-o: .55;
  --radius: 22px; --bw: 3px; --shadow: 5px 6px 0 #3b2412;
  --font-display: "Luckiest Guy", "ZCOOL KuaiLe", "Impact", system-ui, sans-serif; --disp-track: .03em;
}

html {
  height: 100%;
  transition: --bg1 var(--t), --bg2 var(--t), --paper var(--t), --ink var(--t), --accent var(--t),
              --accent2 var(--t), --line var(--t), --plate var(--t);
}
* { box-sizing: border-box; }
body {
  min-height: 100%; margin: 0;
  background: linear-gradient(170deg, var(--bg1), var(--bg2)) fixed, var(--bg2);
  color: var(--ink);
  font: 400 15px/1.5 var(--font-body);
  overflow-x: hidden;
}

/* ---------- background layers ---------- */
.fx, #art { position: fixed; inset: 0; pointer-events: none; }
.fx { opacity: 0; transition: opacity var(--t); }
:root[data-style="miyazaki"] .fx-miyazaki,
:root[data-style="naruto"] .fx-naruto,
:root[data-style="slamdunk"] .fx-slamdunk,
:root[data-style="demonslayer"] .fx-demonslayer,
:root[data-style="onepiece"] .fx-onepiece { opacity: 1; }

.fx-miyazaki {
  background:
    radial-gradient(ellipse 16% 7% at 18% 16%, #fff 55%, transparent 70%),
    radial-gradient(ellipse 11% 6% at 26% 13%, #fff 55%, transparent 70%),
    radial-gradient(ellipse 20% 8% at 78% 24%, #ffffffe6 55%, transparent 70%),
    radial-gradient(ellipse 12% 5% at 70% 21%, #ffffffd9 55%, transparent 70%),
    radial-gradient(circle at 88% 8%, #fff4c2 0 4%, #ffe89a55 9%, transparent 22%),
    radial-gradient(ellipse 75% 26% at 15% 108%, #8fcf78 60%, transparent 61%),
    radial-gradient(ellipse 70% 22% at 85% 110%, #a9db8c 60%, transparent 61%);
  filter: blur(1.5px);
}
.fx-naruto {
  background:
    repeating-conic-gradient(from 3deg at 50% 46%, rgb(255 255 255 / .2) 0 2.5deg, transparent 2.5deg 11deg),
    radial-gradient(circle at 50% 46%, rgb(255 244 210 / .7) 0 14%, transparent 48%);
}
.fx-slamdunk {
  background:
    radial-gradient(rgb(0 0 0 / .16) 1.1px, transparent 1.7px) 0 0 / 7px 7px,
    repeating-conic-gradient(from 0deg at 50% 45%, rgb(0 0 0 / .07) 0 .8deg, transparent .8deg 5deg);
  -webkit-mask: radial-gradient(circle at 50% 45%, transparent 22%, #000 70%);
          mask: radial-gradient(circle at 50% 45%, transparent 22%, #000 70%);
}
.fx-demonslayer {
  background: conic-gradient(#2c6b57 25%, #0f1915 0 50%, #2c6b57 0 75%, #0f1915 0) 0 0 / 76px 76px;
  -webkit-mask: linear-gradient(180deg, #000a, #0003 45%, #0009);
          mask: linear-gradient(180deg, #000a, #0003 45%, #0009);
}
.fx-onepiece {
  background:
    radial-gradient(circle at 85% 10%, #fff6c4 0 5%, #ffd54f66 10%, transparent 26%),
    linear-gradient(rgb(255 255 255 / .14) 1px, transparent 1px) 0 0 / 96px 96px,
    linear-gradient(90deg, rgb(255 255 255 / .14) 1px, transparent 1px) 0 0 / 96px 96px,
    radial-gradient(ellipse 60% 14% at 50% 104%, #0a4f86 60%, transparent 61%);
}

#art { width: 100%; height: 100%; }
#art g.layer { stroke: var(--line); stroke-width: var(--line-w); fill: none; stroke-linecap: round; stroke-linejoin: round; transition: stroke var(--t); }
#art .m {
  opacity: 0; transform: scale(.6) rotate(-14deg);
  transform-box: fill-box; transform-origin: center;
  transition: opacity .9s ease, transform 1.1s cubic-bezier(.3, 1.4, .5, 1);
}
#art g.layer.on .m { opacity: var(--line-o); transform: none; }

/* ---------- stage ---------- */
.stage {
  position: relative; z-index: 1;
  width: 100%; max-width: 900px; margin: 0 auto; min-height: 100%;
  display: grid; align-content: center; gap: clamp(24px, 5vw, 48px);
  grid-template-areas: "inputs" "dials" "demo";
  padding-block: clamp(24px, 6vh, 64px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.row { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(12px, 4vw, 44px); align-items: stretch; }
.row > * { min-width: 0; }
.row.inputs { grid-area: inputs; }
.row.dials { grid-area: dials; align-items: start; }
@media (min-width: 1000px) {
  .stage { max-width: 1240px; grid-template-columns: minmax(260px, 330px) 1fr; grid-template-areas: "demo inputs" "demo dials"; column-gap: 48px; }
}

/* ---------- demo video ---------- */
.demo { grid-area: demo; margin: 0; padding: 12px; display: grid; gap: 10px; align-self: center; justify-self: center; width: 100%; max-width: 360px; }
.demo video { display: block; width: 100%; height: auto; aspect-ratio: 600 / 788; max-width: 100%; object-fit: cover; background: #000;
  border-radius: calc(var(--radius) * .5); border: var(--bw) solid var(--ink); transition: border-color var(--t), border-radius var(--t); }
.demo figcaption { display: grid; gap: 2px; padding-inline: 4px; }
.demo figcaption strong { font: 400 18px/1.2 var(--font-display); letter-spacing: var(--disp-track); color: var(--accent); transition: color var(--t); }
.demo figcaption span { font-size: 12.5px; opacity: .75; }

/* ---------- dial titles ---------- */
.dial-wrap { display: grid; justify-items: center; gap: 14px; min-width: 0; }
.dial-title { display: grid; justify-items: center; gap: 4px; text-align: center; padding: 10px 18px 12px; max-width: 100%; }
.dial-title strong {
  font: 400 clamp(19px, 2.8vw, 27px)/1.1 var(--font-display); letter-spacing: var(--disp-track); color: var(--ink);
  background: linear-gradient(transparent 58%, color-mix(in srgb, var(--accent2) 70%, transparent) 58% 92%, transparent 92%);
  padding-inline: 4px; transition: color var(--t);
}
.dial-title span { font-size: clamp(12px, 1.6vw, 14px); font-weight: 700; color: var(--accent); text-wrap: balance; transition: color var(--t); }

/* ---------- rotary dial ---------- */
.dial { display: grid; place-items: center; outline: none; touch-action: none; }
.dial svg { width: min(100%, 340px); height: auto; overflow: visible; filter: drop-shadow(0 10px 18px rgb(0 0 0 / .14)); }
.dial:focus-visible svg .plate { stroke: var(--accent2); stroke-width: 8; }
.dial .plate { fill: var(--plate); stroke: var(--ink); stroke-width: var(--bw); transition: fill var(--t), stroke var(--t); }
.dial .tick { fill: var(--ink); opacity: .55; }
.dial .rot { cursor: grab; }
.dial.grabbing .rot { cursor: grabbing; }
.dial .wedge { fill: var(--accent); stroke: var(--ink); stroke-width: calc(var(--bw) * .6); transition: fill var(--t), stroke var(--t); }
.dial .wedge.alt { fill: color-mix(in srgb, var(--accent) 80%, var(--ink)); }
.dial .wedge.sel { fill: var(--paper); }
.dial .disc-edge { fill: none; stroke: var(--ink); stroke-width: var(--bw); transition: stroke var(--t); }
.dial .rim { fill: none; stroke: var(--ink); stroke-width: var(--bw); opacity: .9; }
.dial .lab { pointer-events: none; }
.dial .wedge-label { fill: var(--paper); font: 700 14px/1 var(--font-body); text-anchor: middle; dominant-baseline: central; transition: fill var(--t); }
.dial .lab.sel .wedge-label { fill: var(--ink); }
.dial .card { fill: var(--paper); stroke: var(--ink); stroke-width: var(--bw); transition: fill var(--t); }
.dial .cap { fill: var(--ink); opacity: .6; font: 700 8.5px/1 var(--font-body); letter-spacing: .16em; text-anchor: middle; }
.dial .val { fill: var(--ink); font-family: var(--font-display); font-size: 17px; letter-spacing: var(--disp-track); text-anchor: middle; transition: opacity .25s; }
.dial .val.fade { opacity: 0; }
.dial .stop, .dial .stop2 { pointer-events: none; }
.dial .stop { stroke: #b9bec6; stroke-width: 9; stroke-linecap: round; }
.dial .stop2 { stroke: #eef0f3; stroke-width: 3; stroke-linecap: round; }

/* ---------- shared surface ---------- */
.surface {
  background: var(--paper); color: var(--ink);
  border: var(--bw) solid var(--ink); border-radius: var(--radius); box-shadow: var(--shadow);
  transition: background-color var(--t), color var(--t), border-color var(--t), border-radius var(--t), box-shadow var(--t), border-width var(--t);
}

/* ---------- upload ---------- */
.upload { position: relative; display: grid; place-items: center; text-align: center; gap: 10px; padding: 22px 18px; cursor: pointer; min-height: 220px; }
.upload input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.upload::before {
  content: ""; position: absolute; inset: 9px; border-radius: calc(var(--radius) - 6px);
  border: 2px dashed var(--accent); opacity: .7; transition: border-color var(--t), border-radius var(--t), opacity .2s;
}
.upload.over::before, .upload:hover::before { opacity: 1; border-style: solid; }
.upload:focus-within::before { opacity: 1; border-color: var(--accent2); border-width: 3px; }
.upload .film { width: 58px; height: 58px; color: var(--accent); transition: color var(--t), transform .3s; }
.upload:hover .film { transform: translateY(-3px) rotate(-4deg); }
.upload .big { font: 400 clamp(17px, 2.6vw, 22px)/1.15 var(--font-display); letter-spacing: var(--disp-track); text-wrap: balance; margin: 0; }
.upload .small { margin: 0; font-size: 12.5px; opacity: .72; }
.upload video { width: 100%; max-width: 260px; aspect-ratio: 16/9; object-fit: cover; border-radius: calc(var(--radius) * .5); border: var(--bw) solid var(--ink); background: #000; }
.upload .file { margin: 0; font-size: 13px; font-weight: 700; overflow-wrap: anywhere; }

/* ---------- payment QR ---------- */
.pay { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 18px; padding: 20px; min-height: 220px; }
.qr {
  width: 148px; aspect-ratio: 1; max-width: 100%; padding: 10px; background: #fff;
  border: var(--bw) solid var(--ink); border-radius: calc(var(--radius) * .45);
  display: grid; place-items: center; position: relative; overflow: hidden;
  transition: border-color var(--t), border-radius var(--t);
}
.qr canvas, .qr img { width: 100% !important; height: auto !important; display: block; image-rendering: pixelated; }
.qr .ghost { width: 100%; height: 100%; color: var(--ink); opacity: .16; }
.qr.live { animation: pop .5s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { from { transform: scale(.85); } to { transform: none; } }
.pay-copy { display: grid; gap: 6px; min-width: 0; }
.price { margin: 0; font: 400 clamp(30px, 5vw, 42px)/1 var(--font-display); letter-spacing: var(--disp-track); color: var(--accent); transition: color var(--t); }
.price small { font: 700 13px/1 var(--font-body); color: var(--ink); opacity: .65; letter-spacing: 0; margin-left: 4px; }
.pay-line { margin: 0; font-weight: 700; text-wrap: balance; }
.pay-line a { color: var(--accent); }
.pay-meta { margin: 0; font-size: 12.5px; opacity: .7; }
.methods { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 99px; border: 1.5px solid currentColor; }
.chip.wx { color: #1aad19; } .chip.ali { color: #1677ff; } .chip.card { color: var(--ink); }
.bar { height: 6px; border-radius: 6px; background: color-mix(in srgb, var(--ink) 14%, transparent); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }

@media (max-width: 640px) {
  .row.inputs { grid-template-columns: 1fr; }
  .pay { grid-template-columns: 120px 1fr; }
  .qr { width: 120px; }
}
@media (prefers-reduced-motion: reduce) {
  :root { --t: .01s linear; }
  #art .m, .fx, .qr.live { transition: none; animation: none; }
}
</style>
</head>
<body>

<div class="fx fx-miyazaki" aria-hidden="true"></div>
<div class="fx fx-naruto" aria-hidden="true"></div>
<div class="fx fx-slamdunk" aria-hidden="true"></div>
<div class="fx fx-demonslayer" aria-hidden="true"></div>
<div class="fx fx-onepiece" aria-hidden="true"></div>

<!-- Background line art. One layer per theme; the left dial switches which layer is on. -->
<svg id="art" aria-hidden="true">
  <defs>
    <!-- Sports -->

  <g class="layer" data-theme="sports"></g>
  <g class="layer" data-theme="travel"></g>
  <g class="layer" data-theme="portrait"></g>
  <g class="layer" data-theme="comedy"></g>
</svg>

<main class="stage">
  <div class="row inputs">
    <label class="upload surface" id="upload" for="video">
      <input type="file" id="video" name="video" accept="video/*">
      <svg class="film" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="8" width="36" height="32" rx="3"/><path d="M12 8v32M36 8v32M6 16h6M6 24h6M6 32h6M36 16h6M36 24h6M36 32h6M21 18l8 6-8 6z"/></svg>
      <p class="big" id="upBig">Drop your game clip here</p>
      <p class="small" id="upSmall">or tap to choose · MP4 or MOV, 10–90 seconds works best</p>
    </label>

    <div class="pay surface" id="pay" aria-live="polite">
      <div class="qr" id="qr">
        <svg class="ghost" viewBox="0 0 29 29" aria-hidden="true" fill="currentColor"><path d="M0 0h7v7H0zM1 1v5h5V1zM2 2h3v3H2zM22 0h7v7h-7zM23 1v5h5V1zM24 2h3v3h-3zM0 22h7v7H0zM1 23v5h5v-5zM2 24h3v3H2zM9 1h2v2H9zM12 0h3v1h-3zM16 2h2v3h-2zM9 5h4v2H9zM19 0h1v4h-1zM0 9h2v2H0zM4 9h3v1H4zM9 9h3v3H9zM14 8h2v2h-2zM18 9h4v1h-4zM24 9h2v3h-2zM27 8h2v2h-2zM1 13h3v2H1zM6 12h2v4H6zM11 14h4v1h-4zM17 12h2v3h-2zM21 13h3v1h-3zM26 14h3v2h-3zM0 17h2v2H0zM4 18h4v1H4zM10 17h2v4h-2zM14 18h3v2h-3zM19 17h4v1h-4zM25 18h1v3h-1zM27 20h2v1h-2zM9 23h3v1H9zM13 22h2v3h-2zM17 23h3v2h-3zM9 26h2v3H9zM12 27h4v1h-4zM18 26h2v2h-2zM22 22h3v3h-3zM26 23h3v1h-3zM23 26h1v3h-1zM26 26h3v3h-3z"/></svg>
      </div>
      <div class="pay-copy">
        <p class="price" id="price">¥39<small>per manga</small></p>
        <p class="pay-line" id="payLine">Upload a clip and your payment code appears here.</p>
        <div class="methods" id="methods"><span class="chip wx">WeChat Pay</span><span class="chip ali">Alipay</span></div>
        <p class="pay-meta" id="payMeta">3–5 pages · Sports · Hayao Miyazaki</p>
      </div>
    </div>
  </div>

  <div class="row dials">
    <div class="dial-wrap">
      <div class="dial-title surface"><strong id="themeTitle">Background theme</strong><span id="themeHint">Turn to set the scene of your manga</span></div>
      <div class="dial" id="themeDial" tabindex="0" role="slider" aria-label="Background theme"></div>
    </div>
    <div class="dial-wrap">
      <div class="dial-title surface"><strong id="styleTitle">Art style</strong><span id="styleHint">Turn to choose how your manga is drawn</span></div>
      <div class="dial" id="styleDial" tabindex="0" role="slider" aria-label="Art style"></div>
    </div>
  </div>

  <figure class="demo surface">
    <video id="demoVideo" src="demo/moment-demo.mp4?v=3" poster="demo/moment-demo.jpg?v=3" muted autoplay loop playsinline preload="metadata" aria-label="Sample: a real game clip on top, the manga we drew from it below"></video>
    <figcaption><strong id="demoTitle">See it in action</strong><span id="demoText">Top: the uploaded game clip. Bottom: the manga pages we drew from it.</span></figcaption>
  </figure>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(() => {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const root = document.documentElement;
  const $ = id => document.getElementById(id);

  /* ---------------- language ---------------- */
  const ZH = /^zh/i.test(root.lang);
  const API = ZH ? "../api/" : "api/";      // the Chinese page lives one folder down, at zh/
  const T = ZH ? {
    title: "那一刻漫画", themeCap: "背景主题", styleCap: "漫画画风",
    themeHint: "转动选择漫画的场景", styleHint: "转动选择漫画的绘画风格",
    demoTitle: "效果示例", demoText: "上：用户上传的比赛视频。下：我们据此画出的漫画。", themeAria: "背景主题", styleAria: "画风",
    themes: [["运动"], ["旅行与家居"], ["人像写真"], ["搞笑"]],
    styles: [["宫崎骏"], ["火影忍者"], ["灌篮高手"], ["鬼灭之刃"], ["海贼王"]],
    upBig: "把比赛视频拖到这里", upSmall: "或点击选择 · MP4 / MOV，10–90 秒效果最好",
    unit: "/ 本", payIdle: "上传视频后，这里会出现付款码。", pages: "3–5 页",
    methods: { wechat: "微信支付", alipay: "支付宝", card: "银行卡" },
    ready: "视频已就绪", replace: "点击可更换", seconds: "秒",
    notVideo: "这不是视频文件，请选择 MP4 或 MOV。",
    tooBig: (mb, max) => `视频有 ${mb} MB，上限是 ${max} MB，请剪短后再试。`,
    demo: "预览：这是示例付款码。正式网站会打开微信支付或支付宝。",
    uploading: "上传中…", uploadFail: "上传失败，请检查网络后重新拖入视频。",
    scan: "扫码付款，到账后立刻开始绘制。", drawing: "已付款，正在绘制漫画…",
    done: url => `漫画已完成。<a href="${url}" target="_blank" rel="noopener">下载 PDF</a>`,
    failed: id => `绘制时出错了。请把订单号 ${id} 发给我们，我们会退款。`,
  } : {
    title: "Moment Manga", themeCap: "Background theme", styleCap: "Art style",
    themeHint: "Turn to set the scene of your manga", styleHint: "Turn to choose how your manga is drawn",
    demoTitle: "See it in action", demoText: "Top: the uploaded game clip. Bottom: the manga pages we drew from it.", themeAria: "Background theme", styleAria: "Art style",
    themes: [["Sports"], ["Travel &", "Home Life"], ["Portrait", "Photos"], ["Comedy"]],
    styles: [["Hayao", "Miyazaki"], ["Naruto"], ["Slam", "Dunk"], ["Demon", "Slayer"], ["One", "Piece"]],
    upBig: "Drop your game clip here", upSmall: "or tap to choose · MP4 or MOV, 10–90 seconds works best",
    unit: "per manga", payIdle: "Upload a clip and your payment code appears here.", pages: "3–5 pages",
    methods: { wechat: "WeChat Pay", alipay: "Alipay", card: "Card" },
    ready: "Clip ready", replace: "tap to replace", seconds: "s",
    notVideo: "That file isn't a video. Choose an MP4 or MOV clip.",
    tooBig: (mb, max) => `That clip is ${mb} MB. The limit is ${max} MB; trim it and try again.`,
    demo: "Preview: this is a sample code. On the live site it opens WeChat Pay or Alipay.",
    uploading: "Uploading…", uploadFail: "Upload failed. Check your connection and drop the clip again.",
    scan: "Scan to pay. We start drawing the moment it clears.", drawing: "Paid. Drawing your manga…",
    done: url => `Your manga is ready. <a href="${url}" target="_blank" rel="noopener">Download the PDF</a>`,
    failed: id => `Something went wrong while drawing. Send us order number ${id} and we'll refund you.`,
  };
  document.title = T.title;
  $("themeTitle").textContent = T.themeCap; $("themeHint").textContent = T.themeHint;
  $("styleTitle").textContent = T.styleCap; $("styleHint").textContent = T.styleHint;
  $("demoTitle").textContent = T.demoTitle; $("demoText").textContent = T.demoText;
  if (ZH) { const v = $("demoVideo"); v.poster = "../demo/moment-demo.jpg?v=3"; v.src = "../demo/moment-demo.mp4?v=3"; v.setAttribute("aria-label", T.demoText); }
  $("upBig").textContent = T.upBig; $("upSmall").textContent = T.upSmall; $("payLine").textContent = T.payIdle;

  /* ---------------- background line art ---------------- */
  const MOTIFS = {
    sports:   ["basketball", "soccer", "swim", "racket", "trophy", "whistle"],
    travel:   ["suitcase", "plane", "house", "cup", "plant", "pin"],
    portrait: ["camera", "frame", "face", "flower", "sparkle", "film"],
    comedy:   ["bubble", "laugh", "burst", "banana", "pie", "sweat"],
  };
  const art = $("art");
  const NS = "http://www.w3.org/2000/svg";
  function rand(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
  function drawArt() {
    const w = innerWidth, h = innerHeight;
    art.setAttribute("viewBox", `0 0 ${w} ${h}`);
    const cell = w < 560 ? 104 : 150;
    art.querySelectorAll("g.layer").forEach((layer, li) => {
      const r = rand(li * 977 + 13), list = MOTIFS[layer.dataset.theme];
      layer.replaceChildren();
      let n = 0;
      for (let y = -cell * .3; y < h + cell * .2; y += cell * .86) {
        for (let x = ((y / cell) % 2 ? cell * .5 : 0) - cell * .3; x < w + cell * .2; x += cell) {
          const size = cell * (.38 + r() * .26);
          const g = document.createElementNS(NS, "g");
          g.setAttribute("transform", `translate(${x + r() * cell * .4} ${y + r() * cell * .3}) rotate(${(r() - .5) * 40})`);
          const u = document.createElementNS(NS, "use");
          u.setAttribute("href", "#i-" + list[n++ % list.length]);
          u.setAttribute("width", size); u.setAttribute("height", size);
          u.setAttribute("class", "m");
          u.style.transitionDelay = (r() * .7).toFixed(2) + "s";
          g.appendChild(u); layer.appendChild(g);
        }
      }
    });
  }
  let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(drawArt, 150); });
  drawArt();
  function setTheme(key) {
    root.dataset.themeBg = key;
    art.querySelectorAll("g.layer").forEach(l => l.classList.toggle("on", l.dataset.theme === key));
    updateMeta();
  }
  function setStyle(key) { root.dataset.style = key; updateMeta(); }

  /* ---------------- rotary dial ----------------
     The options split the whole dial face into equal wedges, each with a finger hole.
     Turning the dial brings a wedge to the finger stop, and the dial stays there. */
  const STOP = 135;                      // finger stop, degrees clockwise from 12 o'clock
  const R_OUT = 134, R_IN = 54, R_HOLE = 117, R_LABEL = 84;
  const polar = (r, a) => { const t = a * Math.PI / 180; return [+(r * Math.sin(t)).toFixed(2), +(-r * Math.cos(t)).toFixed(2)]; };
  const ease = k => 1 - Math.pow(1 - k, 3) * (1 - 1.6 * k * (1 - k));      // ease-out with a small settle
  const wrap = d => ((d % 360) + 540) % 360 - 180;                          // shortest signed turn
  const lines = (arr, y, lh) => arr.map((s, i) =>
    `<tspan x="0" y="${(y + (i - (arr.length - 1) / 2) * lh).toFixed(1)}">${s}</tspan>`).join("");

  function makeDial(el, { caption, aria, options, initial, onChange }) {
    const N = options.length, step = 360 / N, uid = el.id, holeR = N > 4 ? 13.5 : 15;
    let wedges = "", mask = "", rims = "", labels = "";
    options.forEach((o, i) => {
      const a = i * step, a0 = a - step / 2, a1 = a + step / 2;
      const [ox0, oy0] = polar(R_OUT, a0), [ox1, oy1] = polar(R_OUT, a1), [ix1, iy1] = polar(R_IN, a1), [ix0, iy0] = polar(R_IN, a0);
      wedges += `<path class="wedge${i % 2 ? " alt" : ""}" data-i="${i}" d="M${ix0} ${iy0}L${ox0} ${oy0}A${R_OUT} ${R_OUT} 0 0 1 ${ox1} ${oy1}L${ix1} ${iy1}A${R_IN} ${R_IN} 0 0 0 ${ix0} ${iy0}Z"/>`;
      const [hx, hy] = polar(R_HOLE, a + step * .3);   // finger hole sits near the rim, beside the label
      mask += `<circle cx="${hx}" cy="${hy}" r="${holeR}" fill="#000"/>`;
      rims += `<circle class="rim" cx="${hx}" cy="${hy}" r="${holeR}"/>`;
      const [lx, ly] = polar(R_LABEL, a);
      labels += `<g class="lab" data-i="${i}" data-x="${lx}" data-y="${ly}"><text class="wedge-label">${lines(o.short, 0, 13)}</text></g>`;
    });
    let ticks = "";
    for (let a = 0; a < 360; a += 6) { const [x, y] = polar(142, a); ticks += `<circle class="tick" cx="${x}" cy="${y}" r="${a % 30 ? .9 : 1.8}"/>`; }
    const [s1x, s1y] = polar(120, STOP), [s2x, s2y] = polar(152, STOP);
    el.setAttribute("aria-label", aria);
    el.innerHTML = `
      <svg viewBox="-160 -160 320 320" aria-hidden="true">
        <defs><mask id="${uid}-m" maskUnits="userSpaceOnUse" x="-160" y="-160" width="320" height="320">
          <circle r="${R_OUT + 1}" fill="#fff"/>${mask}</mask></defs>
        <circle class="plate" r="150"/>${ticks}
        <g class="rot">
          <g mask="url(#${uid}-m)">${wedges}</g>
          <circle class="disc-edge" r="${R_OUT}"/>
          ${rims}${labels}
        </g>
        <circle class="card" r="${R_IN - 2}"/>
        <text class="val"></text>
        <line class="stop" x1="${s1x}" y1="${s1y}" x2="${s2x}" y2="${s2y}"/>
        <line class="stop2" x1="${s1x}" y1="${s1y}" x2="${s2x}" y2="${s2y}"/>
      </svg>`;
    const svg = el.querySelector("svg"), rot = el.querySelector(".rot"), val = el.querySelector(".val");
    const labs = [...el.querySelectorAll(".lab")], wedgeEls = [...el.querySelectorAll(".wedge")];
    let angle = 0, sel = initial, anim = 0;

    function setAngle(a) {
      angle = a;
      rot.setAttribute("transform", `rotate(${a.toFixed(2)})`);
      // keep every label upright while the disc turns
      labs.forEach(l => l.setAttribute("transform", `translate(${l.dataset.x} ${l.dataset.y}) rotate(${(-a).toFixed(2)})`));
    }
    const restFor = i => STOP - i * step;
    const nearest = () => ((Math.round((STOP - angle) / step) % N) + N) % N;
    function turnTo(i) {
      const from = angle, to = angle + wrap(restFor(i) - angle), ms = reduce ? 1 : 260 + Math.abs(to - from) * 3.2;
      const t0 = performance.now(), id = ++anim;
      const f = t => { if (id !== anim) return; const k = Math.min(1, (t - t0) / ms); setAngle(from + (to - from) * ease(k)); if (k < 1) requestAnimationFrame(f); };
      requestAnimationFrame(f);
      commit(i);
    }
    function show(i, animate) {
      const paint = () => { val.innerHTML = lines(options[i].full, 0, 18); val.classList.remove("fade"); };
      if (animate && !reduce) { val.classList.add("fade"); setTimeout(paint, 220); } else paint();
      wedgeEls.forEach(w => w.classList.toggle("sel", +w.dataset.i === i));
      labs.forEach(l => l.classList.toggle("sel", +l.dataset.i === i));
      el.setAttribute("aria-valuenow", i);
      el.setAttribute("aria-valuetext", options[i].full.join(" "));
    }
    function commit(i) { if (i === sel) return; sel = i; show(i, true); onChange(options[i].key); }

    // drag the disc anywhere; on release it settles on the nearest option and stays there
    const pointerAngle = e => { const b = svg.getBoundingClientRect();
      return Math.atan2(e.clientX - (b.left + b.width / 2), -(e.clientY - (b.top + b.height / 2))) * 180 / Math.PI; };
    let drag = null;
    rot.addEventListener("pointerdown", e => {
      e.preventDefault(); svg.setPointerCapture(e.pointerId); anim++;
      const w = e.target.closest("[data-i]");
      drag = { last: pointerAngle(e), moved: 0, i: w ? +w.dataset.i : null };
      el.classList.add("grabbing");
    });
    svg.addEventListener("pointermove", e => {
      if (!drag) return;
      const a = pointerAngle(e), d = wrap(a - drag.last); drag.last = a; drag.moved += Math.abs(d);
      setAngle(angle + d);
    });
    const end = () => { if (!drag) return; const { moved, i } = drag; drag = null; el.classList.remove("grabbing");
      turnTo(moved < 4 && i !== null ? i : nearest()); };
    svg.addEventListener("pointerup", end); svg.addEventListener("pointercancel", end);

    el.setAttribute("aria-valuemin", 0); el.setAttribute("aria-valuemax", N - 1);
    el.addEventListener("keydown", e => {
      const k = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[e.key]; if (!k) return;
      e.preventDefault(); turnTo((sel + k + N) % N);
    });
    setAngle(restFor(sel)); show(sel, false);
    return { get value() { return options[sel]; } };
  }

  const THEME_KEYS = ["sports", "travel", "portrait", "comedy"];
  const STYLE_KEYS = ["miyazaki", "naruto", "slamdunk", "demonslayer", "onepiece"];
  const short = full => full;   // multi-word names wrap so they stay clear of the finger holes
  const themeDial = makeDial($("themeDial"), {
    caption: T.themeCap, aria: T.themeAria, initial: 0, onChange: setTheme,
    options: THEME_KEYS.map((key, i) => ({ key, full: T.themes[i], short: short(T.themes[i]) })),
  });
  const styleDial = makeDial($("styleDial"), {
    caption: T.styleCap, aria: T.styleAria, initial: 0, onChange: setStyle,
    options: STYLE_KEYS.map((key, i) => ({ key, full: T.styles[i], short: short(T.styles[i]) })),
  });
  requestAnimationFrame(() => setTheme("sports"));

  /* ---------------- upload + payment ---------------- */
  const upload = $("upload"), input = $("video"), qr = $("qr");
  let config = null, order = null, poll = null;
  const sample = { price: "¥39", methods: ["wechat", "alipay"] };
  paintPrice();
  fetch(API + "config").then(r => r.ok ? r.json() : null).then(c => { if (c) { config = c; paintPrice(); } }).catch(() => {});

  function paintPrice() {
    const c = config || sample;
    $("price").innerHTML = `${c.price}<small>${T.unit}</small>`;
    const cls = { wechat: "wx", alipay: "ali", card: "card" };
    $("methods").innerHTML = c.methods.map(m => `<span class="chip ${cls[m]}">${T.methods[m]}</span>`).join("");
  }
  function updateMeta() {
    const t = themeDial?.value?.full.join(ZH ? "" : " "), s = styleDial?.value?.full.join(ZH ? "" : " ");
    if (t && s) $("payMeta").textContent = `${T.pages} · ${t} · ${s}`;
    if (order && config && order.status === "unpaid")
      fetch(`${API}orders/${order.id}/options`, { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ theme: themeDial.value.key, style: styleDial.value.key }) }).catch(() => {});
  }
  function showQR(text) {
    qr.replaceChildren(); qr.classList.remove("live"); void qr.offsetWidth; qr.classList.add("live");
    if (window.QRCode) new QRCode(qr, { text, width: 256, height: 256, colorDark: "#111111", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
    else qr.textContent = text;
  }
  const line = html => { $("payLine").innerHTML = html; };

  ["dragenter", "dragover"].forEach(t => upload.addEventListener(t, e => { e.preventDefault(); upload.classList.add("over"); }));
  ["dragleave", "drop"].forEach(t => upload.addEventListener(t, () => upload.classList.remove("over")));
  upload.addEventListener("drop", e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) take(f); });
  input.addEventListener("change", () => { const f = input.files[0]; if (f) take(f); });

  function take(file) {
    if (!file.type.startsWith("video/")) { $("upSmall").textContent = T.notVideo; return; }
    const maxMb = config?.max_upload_mb || 300;
    if (file.size > maxMb * 1048576) { $("upSmall").textContent = T.tooBig((file.size / 1048576).toFixed(0), maxMb); return; }
    const v = document.createElement("video");
    v.muted = true; v.playsInline = true; v.loop = true; v.autoplay = true; v.src = URL.createObjectURL(file);
    upload.querySelector(".film, video").replaceWith(v);
    $("upBig").textContent = T.ready;
    $("upSmall").innerHTML = `<span class="file"></span>`;
    $("upSmall").firstChild.textContent = file.name;
    v.addEventListener("loadedmetadata", () => {
      $("upSmall").firstChild.textContent = `${file.name} · ${Math.round(v.duration)} ${T.seconds} · ${T.replace}`;
    });
    config ? send(file) : demo();
  }

  function demo() {
    showQR("MOMENT-MANGA PREVIEW ORDER · no payment is taken");
    line(T.demo);
  }

  function send(file) {
    clearInterval(poll);
    line(`${T.uploading} <span class="bar"><i id="upBar"></i></span>`);
    const fd = new FormData();
    fd.append("video", file); fd.append("theme", themeDial.value.key); fd.append("style", styleDial.value.key);
    fd.append("lang", ZH ? "zh" : "en");
    const x = new XMLHttpRequest();
    x.open("POST", API + "orders");
    x.upload.onprogress = e => { const b = $("upBar"); if (b && e.lengthComputable) b.style.width = (100 * e.loaded / e.total) + "%"; };
    x.onload = () => {
      if (x.status !== 200) { line(`${T.uploadFail} (${x.status})`); return; }
      order = JSON.parse(x.responseText);
      showQR(order.pay_url);
      line(T.scan);
      poll = setInterval(check, 3000);
    };
    x.onerror = () => line(T.uploadFail);
    x.send(fd);
  }

  async function check() {
    let s; try { s = await (await fetch(`${API}orders/${order.id}`)).json(); } catch { return; }
    order.status = s.status;
    if (s.status === "paid" || s.status === "processing") {
      qr.innerHTML = `<svg viewBox="0 0 48 48" width="70%" fill="none" stroke="#1aad19" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 25l9 9 19-20"/></svg>`;
      line(`${T.drawing} <span class="bar"><i style="width:${s.progress || 5}%"></i></span>`);
    } else if (s.status === "done") {
      clearInterval(poll);
      line(T.done(s.result_url));
    } else if (s.status === "failed") {
      clearInterval(poll);
      line(T.failed(order.id));
    }
  }
})();
</script>
</body>
